services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: about-fit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aboutfit
      POSTGRES_PASSWORD: aboutfit
      POSTGRES_DB: aboutfit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aboutfit -d aboutfit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: about-fit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: about-fit-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aboutfit
      MINIO_ROOT_PASSWORD: aboutfit-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: about-fit-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 aboutfit aboutfit-dev-secret;
      mc mb --ignore-existing local/about-fit-uploads;
      mc mb --ignore-existing local/about-fit-renders;
      mc anonymous set download local/about-fit-renders;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
